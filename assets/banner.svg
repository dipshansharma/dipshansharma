<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Dipshan Sharma, aspiring security analyst">
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1f2a37" stroke-width="1"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#0f1b24"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ff9c" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00ff9c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00ff9c" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect width="900" height="260" rx="14"/></clipPath>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; }
      .name { font-size: 54px; font-weight: 700; fill: #e6edf3; letter-spacing: 3px; }
      .sub  { font-size: 19px; fill: #00ff9c; }
      .tag  { font-size: 14px; fill: #7d8da1; }
      .dim  { font-size: 13px; fill: #4b5b6e; }
      .scan { animation: sweep 5s linear infinite; }
      @keyframes sweep { from { transform: translateY(-80px); } to { transform: translateY(300px); } }
      .type { animation: typing 3.2s steps(46) 0.6s both; }
      @keyframes typing { from { width: 0; } to { width: 590px; } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .glitch1 { animation: g1 6s infinite; }
      .glitch2 { animation: g2 6s infinite; }
      @keyframes g1 { 0%,92%,100% { transform: translate(0,0); opacity: 0; } 93% { transform: translate(-4px,1px); opacity: .8; } 95% { transform: translate(3px,-1px); opacity: .8; } 97% { opacity: 0; } }
      @keyframes g2 { 0%,92%,100% { transform: translate(0,0); opacity: 0; } 94% { transform: translate(4px,-1px); opacity: .8; } 96% { transform: translate(-3px,1px); opacity: .8; } 98% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .scan,.type,.cursor,.glitch1,.glitch2 { animation: none; } .type { width: 590px; } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <rect class="scan" x="0" y="0" width="900" height="80" fill="url(#scan)"/>

    <text class="mono dim" x="36" y="40">// secure by design · monitor everything · learn in public</text>

    <text class="mono name glitch1" x="36" y="116" fill="#ff2e63" style="fill:#ff2e63">DIPSHAN SHARMA</text>
    <text class="mono name glitch2" x="36" y="116" style="fill:#00e5ff">DIPSHAN SHARMA</text>
    <text class="mono name" x="36" y="116">DIPSHAN SHARMA</text>

    <text class="mono sub" x="36" y="156">&gt; aspiring_security_analyst<tspan class="cursor">_</tspan></text>

    <clipPath id="typeclip"><rect class="type" x="36" y="176" width="0" height="40"/></clipPath>
    <text class="mono tag" x="36" y="198" clip-path="url(#typeclip)">SOC · GRC · detection labs  |  BSc Computer Science, CCCU, class of 2028</text>

    <text class="mono dim" x="36" y="238">based in Canterbury, UK</text>
    <text class="mono dim" x="864" y="238" text-anchor="end">status: learning / building / documenting</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#00ff9c" stroke-opacity="0.35"/>
</svg>
